name: CI

# Correctness gate: typecheck + production build, then every Storybook story in
# headless Chromium (render + interaction + axe a11y) in BOTH light and dark.
# Mirrors the local `npm run build` + `npm test` gate documented in AGENTS.md.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Storybook's addon-vitest runs stories as tests in real Chromium via
      # Playwright — the browser binary must be present in CI.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build (tsc + vite)
        run: npm run build

      # The package consumers install (dist-lib via tsup) — keep it building so
      # `npm run build:lib` + the prepack hook can never silently rot.
      - name: Build library (tsup → dist-lib)
        run: npm run build:lib

      - name: Token contrast (WCAG AA, light + dark)
        run: npm run check:contrast

      - name: Design principles (manifest-driven golden rules)
        run: npm run check:principles

      - name: Figma manifest drift (component axes vs code)
        run: npm run check:figma

      - name: Test (Storybook stories, light + dark, a11y)
        run: npm test

  # The consumer path a newcomer actually walks. Deliberately independent of the
  # job above: it installs the PUBLISHED package into examples/starter with no
  # auth and no .npmrc, builds it, and asserts the emitted CSS proves both the
  # token layer and the `@source dist-lib` line landed. It therefore validates
  # what is documented and shipped today — not this branch's source.
  #
  # Release-PR exception: if the starter pin (e.g. ^0.3.0) is not on the
  # registry yet, verify:consumer auto-falls back to --local (packs this tree).
  # That path installs repo deps itself when needed — still no auth / no .npmrc.
  #
  # No upfront `npm ci` here on purpose: the published path must not need the
  # repo's own dependencies, or we would no longer be reproducing a stranger's
  # machine.
  consumer-path:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify the documented install path (published, or local on release bumps)
        run: npm run verify:consumer

  # The public view-only Figma share a LinkedIn visitor actually clicks. Independent
  # of build: it GETs the live URL with a browser User-Agent (bare curl is
  # CloudFront-403'd even when the share is public) and asserts HTTP 200 plus
  # file-identifying content. Catches a revoked "anyone with the link" setting,
  # and guards that the URL opens Foundations & Starters — never Sync Reports.
  figma-share:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify the public Figma share is reachable
        run: npm run verify:figma-share

  # The OpenSpec schema under openspec/schemas/experiment-hub-lite/ is a COPY of
  # experiment-hub's, adapted for a design-system repo. Nothing used to notice
  # when upstream moved, so it drifted one-directionally for a month. This job
  # re-fetches the hub schema and reports what changed since the `x-source`
  # stamp.
  #
  # WARNING-LEVEL ON PURPOSE: it reports on another repo over the network, so it
  # must never be why an MVDS PR cannot merge. The script emits a ::warning::
  # annotation and exits 0. Once it has been quiet for a few PRs, promote it by
  # appending `-- --strict` to the run below.
  schema-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: OpenSpec schema currency (vs experiment-hub)
        env:
          # Lifts the anonymous API rate limit; read-only, public repo.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run check:schema-drift -- --diff
