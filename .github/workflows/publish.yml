name: Publish

# Publishes @beckharrisdesign/mvds to the PUBLIC npm registry on a version tag
# push, or on demand via workflow_dispatch. The tag must match the version in
# package.json — the workflow enforces this before publishing.
#
# Auth is npm Trusted Publishing (OIDC): the job proves its identity to npm
# directly — no long-lived token, no 2FA bypass (npm is phasing those out).
# One-time setup: npmjs.com -> package -> Settings -> Trusted Publisher ->
# GitHub Actions (repo beckharrisdesign/mvds, workflow publish.yml).
#
# To release:
#   1. Bump version in package.json (+ CHANGELOG if maintained).
#   2. Commit: git commit -m "chore: release vX.Y.Z"
#   3. Tag:    git tag vX.Y.Z && git push origin vX.Y.Z
#   The workflow fires automatically and publishes to registry.npmjs.org.
#
# Manual publish (e.g. re-publish same version after a workflow fix):
#   Actions → Publish → Run workflow → pick branch/tag.
#   Note: npm will reject a re-publish of an already-published version.
#   Bump the version first in that case.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm --provenance attestation

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node (public npm registry)
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"
          scope: "@beckharrisdesign"

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships an older npm.
      # Major-pinned so a future npm major can't silently change release behavior.
      - name: Update npm for trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Install dependencies
        run: npm ci

      # Guard: tag version must match package.json version (tag-triggered runs only).
      # workflow_dispatch skips this step — the dispatcher is responsible for
      # ensuring package.json version is correct before triggering manually.
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: package.json version ($PKG_VERSION) != tag ($TAG_VERSION)"
            exit 1
          fi
          echo "Version verified: $PKG_VERSION"

      # prepack hook runs build:lib (tsup) automatically — no explicit step needed.
      # Auth comes from the OIDC token (id-token: write above) exchanged with
      # npm via the Trusted Publisher config; npm also attaches provenance to
      # the publish when authenticated this way, so no --provenance flag.
      - name: Publish to npm
        run: npm publish --access public
