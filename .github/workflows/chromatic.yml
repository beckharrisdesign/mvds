name: Chromatic

# Visual regression on Storybook. Complements the CI gate (render + interaction +
# axe) with pixel-level diffs per story. Non-blocking: visual changes are reported
# for review in Chromatic but do not fail the job or gate merges.
#
# Requires a repo secret CHROMATIC_PROJECT_TOKEN (Chromatic → Manage → Configure).
#
# Outage resilience: the local half (build Storybook + upload) finishes in seconds,
# then the action WAITS on Chromatic's Capture Cloud for snapshot results. When
# Capture Cloud is degraded that wait stalls indefinitely (observed 2026-07-10:
# healthy runs snapshot 55 stories in ~40s; during the incident a single snapshot
# took 4+ min then hung). The step-level timeout below caps that wait so a Chromatic
# outage fails fast instead of burning the full job budget — just re-run the check
# once status.chromatic.com shows Capture Cloud operational again.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main] # establish/update the visual baseline on main

concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromatic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Chromatic needs full git history for baselines + TurboSnap

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Chromatic
        # Pinned to a major tag (not @latest) so a new/compromised major can't be
        # auto-adopted on a step that holds CHROMATIC_PROJECT_TOKEN — matches the
        # @v5 pins on checkout/setup-node above.
        uses: chromaui/action@v18
        # Cap the Capture Cloud wait. Healthy runs finish in well under a minute, so
        # 8 min is generous headroom for a slow-but-working build while cutting an
        # outage stall short (vs. the 20-min job budget). A timeout here surfaces as
        # a failed check — re-run it, don't force-merge, once Chromatic recovers.
        timeout-minutes: 8
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          buildScriptName: build-storybook # reuse the repo's Storybook build
          onlyChanged: true # TurboSnap — only snapshot stories affected by the change
          exitZeroOnChanges: true # non-blocking — report diffs without failing the job
