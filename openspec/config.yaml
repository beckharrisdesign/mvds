# OpenSpec defaults for MVDS (bootstrapped from experiment-hub's experiment-hub-lite).
# New changes use `schema` unless overridden in openspec/changes/<name>/.openspec.yaml.
schema: experiment-hub-lite

context: |
  MVDS — Minimum Viable Design System (this repo). OpenSpec schema is a copy of
  experiment-hub-lite, adapted for a design-system package (not Experiment Hub).

  **Human anchor** — founder prose quoted in proposal.md before specs/design/tasks.

  **Outcomes-first** — Who / Job / Done when drive specs (max 5 requirements) and
  tasks §1 (user-visible checkboxes).

  **Skills per artifact** — experiment-creator (proposal), prd-writer (specs/tasks §1),
  design-advisor (design), prototype-builder (apply). See
  openspec/schemas/experiment-hub-lite/schema.yaml instructions. Hub voice skills are
  copied under skills/ for now; prefer AGENTS.md over hub-specific paths when they conflict.

  **UI system (always):** AGENTS.md golden rules — layout primitives (Stack/Inline/Grid),
  8-grid spacing, semantic type ramp, color tokens, no raw flex/grid for layout, no
  margins for sibling spacing. Code is the single source of truth.

  **Preview surface:** Storybook (`npm run storybook` / `npm test`), not
  `experiments/<slug>/prototype/`. Landing page (`src/App.tsx`) reuses `src/components/site/`.

  **Figma:** MVDS Core fileKey C20nU0mROzk3Zr0I9BELJF (docs/SYNC.md). Library sync is
  one-way code → Figma and only when the founder explicitly asks. design.md may use
  scratch/prototype frames for iteration. Map UI to MVDS tokens/components — never
  hub Tailwind / Fraunces / experiment-kit paths.

  **Apply:** Implement under `src/` (+ Storybook stories). Branch/PR per AGENTS.md
  "Branch & PR workflow" (feat|fix|docs|chore/…; draft PR; founder merges). Package
  manager is npm. Gates: `npm run build`, `npm run check:contrast`,
  `npm run check:principles`, `npm test`.

  **Schemas in this repo:** Only `experiment-hub-lite` is bootstrapped. Do not invent
  bhd-experiment / experiment-hub / quickstart until those schemas are copied in.
