name: experiment-hub-lite
version: 1

# Provenance of this copy. `x-source` names the exact experiment-hub commit this
# schema (and its templates) was reconciled against; `.upstream/` holds the
# verbatim hub files at that commit. `npm run check:schema-drift` re-fetches hub
# main and reports what moved upstream since — so a stale copy surfaces on the
# next PR, not on the next archaeology session. Re-stamp both when you reconcile.
x-source: experiment-hub@bd57a1c

description: >
  Intent-first OpenSpec for MVDS spikes — copied from experiment-hub-lite, adapted
  so Storybook + AGENTS.md replace experiments/*/prototype and hub design kits.

artifacts:
  - id: proposal
    generates: proposal.md
    description: Human anchor, outcomes, and scope in plain language (strategist voice).
    template: proposal.md
    instruction: |
      Before writing, read `skills/experiment-creator.md` and apply its voice and prohibitions to this artifact only.

      **Human anchor (required):** Quote founder prose verbatim (1–3 sentences). Do not proceed with an empty anchor or agent-only paraphrase without a quoted line.

      **Outcomes (required):** Fill Who / Job / Done when / Not doing before Why.

      **Lite constraints:** Max 2 new capabilities (kebab-case). Omit Evidence, Proceed attestation, and Visual board (those belong in design.md when needed).

      **Stop rule:** After writing proposal.md, stop and wait for explicit user approval before creating specs, design, or tasks.

  - id: specs
    generates: specs/**/*.md
    description: PM-style requirements with scenarios (prd-writer voice, max 5 requirements).
    template: spec.md
    requires:
      - proposal
    instruction: |
      Before writing, read `skills/prd-writer.md` and apply outcomes + scenario patterns to this artifact only (not a full PRD file unless the user asked).

      **Outcomes:** Repeat or point to proposal Outcomes at the top.

      **Requirements:** Max 5 `### Requirement:` blocks. Each requirement: one plain-language sentence, optional **Fails until:** line, then normative SHALL (one line max), then at least one `#### Scenario:` with WHEN/THEN.

      **Alignment:** Scenario titles must match tasks.md §1 checkboxes 1:1.

      **Delta ops:** Use ADDED/MODIFIED/REMOVED only when promoting to `openspec/specs/`; for new capabilities, ADDED is enough.

      **Stop rule:** After writing spec(s), stop and wait for explicit user approval before design or tasks.

  - id: design
    generates: design.md
    description: User flow, Figma, and breakpoints (design-advisor voice).
    template: design.md
    requires:
      - proposal
    instruction: |
      Before writing, read `skills/design-advisor.md` and `rules/figma.mdc`; apply checklist thinking to this artifact only (full design report only if user asks).

      **Figma gate (UI changes — REQUIRED, not skippable):** Any change that adds or alters UI MUST produce a Figma **as-is + proposed** pair before design.md is approved, in this repo's page convention (`rules/figma.mdc`):
        1. **`0.0 As is`** — the current surface reconstructed from code (or captured from a running Storybook story); flag any non-code-derivable value as reference.
        2. **`0N.0 Propose: <change-slug>`** — the changed surface, built on MVDS tokens and layout primitives (AGENTS.md, `src/index.css`), not bespoke chrome. New numbered page per iteration; never overwrite a prior one.
      Then fill the Visual design / Figma table with the real **file URL**, **as-is + proposed page/frame names**, **library + version**, breakpoints (BHD Content Types S=480px / L=1024px unless the change is Storybook-only chrome), and status. "Reuses existing components" is NOT grounds to skip — reused components still get placed in a proposed frame.

      **Removals count as UI changes.** Deleting a variant, prop, export, story, or visible component still gets an as-is + proposed pair — the proposed frame shows the surface with the element absent. A deletion rendered this way is reviewable in seconds; "there's nothing to design" is not grounds to skip (hub precedent: remove-workflow-page, 2026-07-21). MVDS is pre-1.0 and removes outright rather than deprecating (AGENTS.md), so this is the common case here, not the rare one.

      **N/A is allowed ONLY for genuinely API-only / no-UI changes** — one row "N/A — no UI" with a brief rationale. If the change renders anything a user sees, it is not API-only.

      **Libraries:** MVDS Core (`C20nU0mROzk3Zr0I9BELJF`) and/or a scratch file for iteration.
      Do not schedule code→Figma library sync unless the founder asks (docs/SYNC.md).

      **No Code Connect.** MVDS does not use it and does not plan to (AGENTS.md) — the hub template's Code Connect row is deliberately absent here.

      **Stop rule:** After writing design.md, stop and wait for explicit user approval before tasks.

  - id: tasks
    generates: tasks.md
    description: User-outcome checkboxes first, then Storybook/preview and implementation.
    template: tasks.md
    requires:
      - specs
      - design
    instruction: |
      Before writing §1, read `skills/prd-writer.md` (outcomes / scenario mapping). Before §2+, read `skills/prototype-builder.md`.

      **§1 User outcomes:** Copy every spec scenario as a numbered checkbox (1.1, 1.2, …). Wording should be user-visible ("User can …"), not file paths.

      **§2 Preview:** Storybook story(ies) and/or landing reuse under `src/components/site/`. Dev command: `npm run storybook` (npm only).

      **§3 Implementation:** `src/` + co-located `*.stories.tsx` per AGENTS.md.

      **§4 QA:** Manual walkthrough aligned to Outcomes; automated `npm test` (stories + a11y light/dark) plus `npm run check:principles` / `check:contrast` / `build` as relevant.

      **Stop rule:** After writing tasks.md, stop and wait for explicit user approval before `/opsx:apply`.

apply:
  requires:
    - tasks
  instruction: |
    Read `skills/openspec-apply-change.md` and `skills/prototype-builder.md`.

    Before coding: read proposal Outcomes and tasks.md §1; confirm Human anchor still matches what you are building.

    **Preview path:** Storybook + site components under `src/components/site/` (and layout/ui as needed). Do not create `experiments/<slug>/prototype/`.

    **Package manager:** npm (see root package.json).

    **UI:** MVDS tokens and layout primitives only (AGENTS.md).

    **Completion:** User runs manual §1 checks before `/opsx:archive`. Do not archive until outcomes checkboxes are satisfied or explicitly waived.

    **When apply finishes** (tasks done, paused with progress, or blocked after coding): follow `skills/openspec-apply-change.md` step 8 — commit (conventional message matching branch type), push, open or update a **draft** PR via `gh` so CI runs. Branch naming per AGENTS.md (`feat/…`, `fix/…`, etc.); `<harness>/<change-name>` — whichever tool is driving, e.g. `claude/…` under Claude Code, `cursor/…` under Cursor — is also fine when it matches an active OpenSpec change. Never hardcode one harness. Skip only if the session changed no files. Never merge or approve the PR. Figma Core sync only if the founder explicitly asks.
